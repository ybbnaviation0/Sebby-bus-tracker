name: sebby_bus_tracker
description: Sebby Bus Tracker — live Brisbane bus tracker using TransLink GTFS + GTFS-Realtime.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  archive: ^3.6.1
  csv: ^6.0.0
  protobuf: ^4.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
