name: Build Sebby Bus Tracker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android scaffolding
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name sebby_bus_tracker .flutter_tmp
            cp -r .flutter_tmp/android ./android
            rm -rf .flutter_tmp
          fi
          # App label shown on the launcher
          MF=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android:label="Sebby Bus Tracker"' "$MF"; then
            sed -i 's#android:label="[^"]*"#android:label="Sebby Bus Tracker"#' "$MF" || true
          fi

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Generate protobuf Dart
        run: |
          mkdir -p lib/gen
          dart pub global activate protoc_plugin
          export PATH="$PATH:$HOME/.pub-cache/bin"
          protoc --dart_out=lib/gen proto/gtfs-realtime.proto

      - name: Add INTERNET permission
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MF"; then
            sed -i 's#<manifest \(.*\)>#<manifest \1>\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MF"
          fi

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sebby-bus-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
